        #loginOverlay::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.35);
        }
        .login-box {
            position: relative; z-index: 1;
            background: rgba(255,255,255,0.92); border-radius: 12px; padding: 40px 50px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); text-align: center;
            min-width: 320px; backdrop-filter: blur(10px);
        }
        .login-box h2 {
            margin-bottom: 24px; font-size: 22px; color: #000;
            font-family: "Times New Roman", "SimHei", "黑体", serif;
        }
        .login-box input {
            width: 100%; padding: 12px 16px; margin-bottom: 16px;
            border: 1px solid #ddd; border-radius: 6px; font-size: 15px;
            font-family: "Times New Roman", "SimHei", "黑体", serif;
        }
        .login-box button {
            width: 100%; padding: 12px; font-size: 16px; border-radius: 6px;
        }
        .login-error {
            color: #f56c6c; font-size: 13px; margin-top: 10px; display: none;
        }

        /* 右侧类型切换栏 */
        .type-sidebar {
            position: fixed; right: 0; top: 50%; transform: translateY(-50%);
            background: white; border-radius: 8px 0 0 8px;
            box-shadow: -2px 0 8px rgba(0,0,0,0.1); overflow: hidden; z-index: 100;
        }
        .type-sidebar button {
            display: block; width: 100%; padding: 14px 16px;
            background: white; color: #000; border-radius: 0;
            border-bottom: 1px solid #eee; font-size: 14px; white-space: nowrap;
        }
        .type-sidebar button:last-of-type:not(.view-toggle) { border-bottom: none; }
        .type-sidebar button:hover { background: #f5f7fa; }
        .type-sidebar button.active {
            background: #409eff; color: white;
        }
        .type-sidebar button .type-tag {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            margin-right: 6px; vertical-align: middle;
        }

        /* 图表容器 */
        .chart-box { width: 100%; height: 450px; margin-top: 10px; position: relative; padding-top: 35px; }
        .chart-legend {
            position: absolute; top: 0; right: 10px; z-index: 10;
            font-size: 15px; color: #000;
            display: flex; align-items: center; gap: 6px;
        }
        .chart-legend .legend-color {
            display: inline-block; width: 14px; height: 14px;
            background: rgba(64, 158, 255, 0.7); border: 1px solid rgba(64, 158, 255, 1);
        }

        /* 筛选器行 */
        .filter-row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
        .filter-row label { font-size: 14px; color: #000; white-space: nowrap; }
        .total-income {
            margin-left: auto;
            font-size: 16px; font-weight: bold;
            color: #000; white-space: nowrap;
        }

        /* 出租号管理 */
        .rent-id-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .rent-id-tag {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px; background: #ecf5ff; border: 1px solid #b3d8ff;
            border-radius: 16px; font-size: 14px; color: #000;
        }
        .rent-id-tag .del-tag {
            cursor: pointer; color: #f56c6c; font-weight: bold; font-size: 16px; line-height: 1;
        }
        .rent-id-tag .del-tag:hover { color: #d85353; }

        /* 折叠记录列表 */
        .record-section { margin-top: 10px; }
        .day-group { margin-bottom: 10px; border: 1px solid #e4e7ed; border-radius: 6px; overflow: hidden; }
        .day-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: #f2f6fc; cursor: pointer; user-select: none;
            font-weight: bold; color: #000; font-size: 15px;
        }
        .day-header:hover { background: #e8edf5; }
        .day-header .arrow { transition: transform 0.2s; font-size: 12px; color: #000; display: inline-block; }
        .day-header .arrow.open { transform: rotate(90deg); }
        .day-header .summary { font-size: 13px; color: #000; font-weight: normal; }

        .day-detail { display: none; }
        .day-detail.open { display: block; }

        .record-table { width: 100%; border-collapse: collapse; }
        .record-table th, .record-table td { border: 1px solid #eee; padding: 8px 10px; text-align: center; font-size: 13px; }
        .record-table th { background: #f2f6fc; color: #000; }
        .record-table tr:nth-child(even) { background: #fafafa; }
        .record-table .income-cell { color: #f56c6c; font-weight: bold; }
        .record-table input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
        .type-badge {
            display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 11px; color: white;
        }
        .type-badge.own { background: #409eff; }
        .type-badge.sublet { background: #e6a23c; }
        .type-badge.agent { background: #67c23a; }

        .empty-tip { text-align: center; color: #000; padding: 30px; font-size: 14px; }

        /* ========== 手机版样式（通过body.mobile类切换） ========== */
        body.mobile { padding: 10px; }
        body.mobile .title { font-size: 18px; margin-bottom: 12px; }

        /* 手机版：标题栏按钮换行 */
        body.mobile div[style*="position:absolute;right:0"] {
            position: static !important;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        body.mobile div[style*="position:absolute;right:0"] button {
            font-size: 12px; padding: 5px 10px;
        }

        /* 手机版：右侧切换栏改为顶部横向 */
        body.mobile .type-sidebar {
            position: static;
            transform: none;
            display: flex;
            border-radius: 8px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        body.mobile .type-sidebar button {
            flex: 1;
            border-bottom: none;
            border-right: 1px solid #eee;
            padding: 10px 8px;
            font-size: 12px;
            text-align: center;
        }
        body.mobile .type-sidebar button:last-of-type:not(.view-toggle) { border-right: none; }
        body.mobile .type-sidebar .view-toggle { flex: 1; display: block; border-right: none; border-top: none; border-left: 1px solid #eee; }
        body.mobile .type-sidebar button .type-tag { display: none; }

        /* 手机版：录入区域改为单列 */
        body.mobile .form-row { flex-direction: column; align-items: stretch; gap: 8px; }
        body.mobile .form-row label { width: 100% !important; text-align: left !important; margin-bottom: 2px; }
        body.mobile select, body.mobile input, body.mobile button { width: 100% !important; }

        /* 手机版：标签行隐藏 */
        body.mobile .card:nth-of-type(3) .form-row:first-child { display: none; }

        /* 手机版：筛选器行 */
        body.mobile .filter-row { gap: 8px; }
        body.mobile .filter-row label { font-size: 13px; }
        body.mobile .total-income { margin-left: 0; font-size: 14px; }

        /* 手机版：图表 */
        body.mobile .chart-box { height: 350px; padding-top: 25px; }
        body.mobile .chart-legend { font-size: 12px; }

        /* 手机版：记录列表表格横向滚动 */
        body.mobile .day-detail { overflow-x: auto; }
        body.mobile .record-table { min-width: 600px; }
        body.mobile .record-table th, body.mobile .record-table td { padding: 6px 4px; font-size: 12px; }

        /* 手机版：登录框 */

<script>
Chart.register(ChartDataLabels);

let chartInstance = null;
let currentType = 'own'; // own | sublet | agent

// 类型配置
const TYPE_CONFIG = {
    own: { name: '自有号直租', color: '#409eff', bg: 'rgba(64, 158, 255, 0.7)', border: 'rgba(64, 158, 255, 1)' },
    sublet: { name: '自有号转租', color: '#e6a23c', bg: 'rgba(230, 162, 60, 0.7)', border: 'rgba(230, 162, 60, 1)' },
    agent: { name: '他人号代租', color: '#67c23a', bg: 'rgba(103, 194, 58, 0.7)', border: 'rgba(103, 194, 58, 1)' }
};

// ===== 密码验证 =====
const VALID_PASSWORDS = ['Zq990529', 'Yt209018'];

function checkPassword() {
    const input = document.getElementById('loginPassword').value.trim();
    if (VALID_PASSWORDS.includes(input)) {
        localStorage.setItem('isLoggedIn', 'true');
        document.getElementById('loginOverlay').style.display = 'none';
    } else {
        document.getElementById('loginError').style.display = 'block';
        document.getElementById('loginPassword').value = '';
        document.getElementById('loginPassword').focus();
    }
}

// 页面加载时检查是否已登录
if (localStorage.getItem('isLoggedIn') === 'true') {
    document.getElementById('loginOverlay').style.display = 'none';
}

document.getElementById('loginPassword').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') checkPassword();
});

// ===== 版本切换 =====
function toggleView() {
    const body = document.body;
    const btn = document.getElementById('viewToggle');
    if (body.classList.contains('mobile')) {
        body.classList.remove('mobile');
        btn.textContent = '📱 切换手机版';
    } else {
        body.classList.add('mobile');
        btn.textContent = '💻 切换电脑版';
    }
}

// ===== 初始化 =====
window.onload = function() {
    initRentIds();
    initChartSelectors();
    initListSelectors();
    renderRecordList();
    renderChart();
    bindDeleteEvents();
};

// ===== 类型切换 =====
function switchType(type) {
    currentType = type;
    document.querySelectorAll('.type-sidebar button').forEach(btn => btn.classList.remove('active'));
    document.getElementById('type' + type.charAt(0).toUpperCase() + type.slice(1)).classList.add('active');

    // 更新出租号管理标题颜色
    const cfg = TYPE_CONFIG[type];
    const manageCard = document.getElementById('rentIdManageCard');
    manageCard.querySelector('h3').style.borderLeftColor = cfg.color;

    // 切换号码列表
    renderRentIdTags();
    refreshRentIdSelect();

    renderChart();
    renderRecordList();
}

// ===== 出租号管理（各类型独立） =====
const DEFAULT_RENT_IDS = {
    own: ['安☔️17357279455', '安🐦17373959185', 'iOS🐦13242149883', 'iOS🐦18157210782', 'iOS🐦19957237451', 'iOS🐦13202390686', 'minico99@126.com'],
    sublet: ['安☔️17357279455', '安🐦17373959185', 'iOS🐦13242149883', 'iOS🐦18157210782', 'iOS🐦19957237451', 'iOS🐦13202390686', 'minico99@126.com'],
    agent: []
};

function getRentIds(type) {
    type = type || currentType;
    const data = localStorage.getItem('rentIds_' + type);
    return data ? JSON.parse(data) : (DEFAULT_RENT_IDS[type] || []);
}

function saveRentIds(ids, type) {
    type = type || currentType;
    localStorage.setItem('rentIds_' + type, JSON.stringify(ids));
}

function initRentIds() {
    renderRentIdTags();
    refreshRentIdSelect();
}

function renderRentIdTags() {
    const list = document.getElementById('rentIdList');
    const ids = getRentIds();
    list.innerHTML = '';
    ids.forEach(id => {
        const tag = document.createElement('span');
        tag.className = 'rent-id-tag';
        tag.innerHTML = `${id}<span class="del-tag" onclick="removeRentId('${id}')">&times;</span>`;
        list.appendChild(tag);
    });
}

function refreshRentIdSelect() {
    const sel = document.getElementById('rentId');
    const ids = getRentIds();
    sel.innerHTML = '';
    ids.forEach(id => {
        const opt = document.createElement('option');
        opt.value = id; opt.textContent = id;
        sel.appendChild(opt);
    });
}

function addRentId() {
    const input = document.getElementById('newRentId');
    const name = input.value.trim();
    if (!name) { alert('请输入出租号名称！'); return; }

    const ids = getRentIds();
    if (ids.includes(name)) { alert('该出租号已存在！'); return; }

    ids.push(name);
    saveRentIds(ids);
    input.value = '';

    renderRentIdTags();
    refreshRentIdSelect();
    renderChart();
    alert('出租号「' + name + '」添加成功！');
}

function removeRentId(id) {
    if (!confirm('确定删除出租号「' + id + '」吗？（仅删除管理列表中的号码，不影响已保存的记录）')) return;

    let ids = getRentIds();
    ids = ids.filter(item => item !== id);
    saveRentIds(ids);

    renderRentIdTags();
    refreshRentIdSelect();
    renderChart();
    alert('出租号「' + id + '」已从管理列表删除！');
}

// 绑定删除按钮事件（事件委托）
function bindDeleteEvents() {
    document.getElementById('btnDeleteSelected').addEventListener('click', deleteSelected);
    document.getElementById('recordSection').addEventListener('click', function(e) {
        if (e.target.classList.contains('btn-delete-single')) {
            const id = parseInt(e.target.getAttribute('data-id'));
            deleteRecord(id);
        }
        if (e.target.closest('.day-header') && !e.target.closest('input[type="checkbox"]') && !e.target.closest('button')) {
            toggleDay(e.target.closest('.day-header'));
        }
        if (e.target.classList.contains('master-checkbox')) {
            toggleDayCheckboxes(e.target);
        }
    });
}

// ===== 图表：年月日三级联动选择器 =====
function initChartSelectors() {
    const now = new Date();
    const records = getRecords();
    const yearSet = new Set([now.getFullYear()]);
    records.forEach(r => yearSet.add(new Date(r.time).getFullYear()));
    const years = [...yearSet].sort((a, b) => b - a);

    const selYear = document.getElementById('chartYear');
    selYear.innerHTML = '';
    years.forEach(y => {
        const opt = document.createElement('option');
        opt.value = y; opt.textContent = y + '年';
        if (y === now.getFullYear()) opt.selected = true;
        selYear.appendChild(opt);
    });

    fillChartMonths(now.getFullYear(), now.getMonth() + 1);
    fillChartDays(now.getFullYear(), now.getMonth() + 1, now.getDate());
}

function onChartYearChange() {
    const year = parseInt(document.getElementById('chartYear').value);
    const now = new Date();
    const defaultMonth = (year === now.getFullYear()) ? now.getMonth() + 1 : 1;
    fillChartMonths(year, defaultMonth);
    const defaultDay = (year === now.getFullYear() && defaultMonth === now.getMonth() + 1) ? now.getDate() : 1;
    fillChartDays(year, defaultMonth, defaultDay);
    renderChart();
}

function onChartMonthChange() {
    const year = parseInt(document.getElementById('chartYear').value);
    const month = parseInt(document.getElementById('chartMonth').value);
    const now = new Date();
    const defaultDay = (year === now.getFullYear() && month === now.getMonth() + 1) ? now.getDate() : 1;
    fillChartDays(year, month, defaultDay);
    renderChart();
}

function fillChartMonths(year, defaultMonth) {
    const records = getRecords();
    const monthSet = new Set();
    records.forEach(r => {
        const d = new Date(r.time);
        if (d.getFullYear() === year) monthSet.add(d.getMonth() + 1);
    });
    monthSet.add(defaultMonth);

    const selMonth = document.getElementById('chartMonth');
    selMonth.innerHTML = '';
    [...monthSet].sort((a, b) => a - b).forEach(m => {
        const opt = document.createElement('option');
        opt.value = m; opt.textContent = m + '月';
        if (m === defaultMonth) opt.selected = true;
        selMonth.appendChild(opt);
    });
}

function fillChartDays(year, month, defaultDay) {
    const records = getRecords();
    const daySet = new Set();
    records.forEach(r => {
        const d = new Date(r.time);
        if (d.getFullYear() === year && d.getMonth() + 1 === month) daySet.add(d.getDate());
    });
    daySet.add(defaultDay);

    const selDay = document.getElementById('chartDay');
    selDay.innerHTML = '';
    const allOpt = document.createElement('option');
    allOpt.value = 'all'; allOpt.textContent = '全月';
    selDay.appendChild(allOpt);
    [...daySet].sort((a, b) => a - b).forEach(d => {
        const opt = document.createElement('option');
        opt.value = d; opt.textContent = d + '日';
        if (d === defaultDay) opt.selected = true;
        selDay.appendChild(opt);
    });
}

// ===== 图表渲染 =====
function renderChart() {
    const records = getRecords().filter(r => r.type === currentType);
    const year = parseInt(document.getElementById('chartYear').value);
    const month = parseInt(document.getElementById('chartMonth').value);
    const dayVal = document.getElementById('chartDay').value;
    const isAllMonth = (dayVal === 'all');
    const day = isAllMonth ? null : parseInt(dayVal);

    // 从记录中提取该时间段内有数据的号码，并累加收益
    const incomeMap = {};
    records.forEach(r => {
        const d = new Date(r.time);
        if (d.getFullYear() === year && d.getMonth() + 1 === month) {
            if (isAllMonth || d.getDate() === day) {
                if (!incomeMap[r.rentId]) incomeMap[r.rentId] = 0;
                incomeMap[r.rentId] += parseFloat(r.income);
            }
        }
    });

    // 按号码名称排序
    const labels = Object.keys(incomeMap).sort();
    const data = labels.map(id => parseFloat(incomeMap[id].toFixed(2)));

    const cfg = TYPE_CONFIG[currentType];
    const chartTitle = isAllMonth
        ? year + '年' + month + '月 ' + cfg.name + '（全月汇总）'
        : year + '年' + month + '月' + day + '日 ' + cfg.name;

    if (chartInstance) chartInstance.destroy();

    const ctx = document.getElementById('incomeChart').getContext('2d');
    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: chartTitle + '(元)',
                data: data,
                backgroundColor: cfg.bg,
                borderColor: cfg.border,
                borderWidth: 1
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                datalabels: {
                    anchor: 'end',
                    align: 'right',
                    offset: 4,
                    padding: { right: 4 },
                    formatter: (val) => val + '元',
                    font: { size: 14, weight: 'bold', family: '"Times New Roman", "SimHei", serif' },
                    display: (ctx) => ctx.dataset.data[ctx.dataIndex] > 0
                },
                legend: { display: false }
            },
            scales: {
                x: {
                    beginAtZero: true, suggestedMax: 10,
                    title: { display: true, text: '收益（元）', font: { size: 15, weight: 'bold', family: '"Times New Roman", "SimHei", serif' } },
                    ticks: { font: { size: 13, family: '"Times New Roman", "SimHei", serif' } }
                },
                y: {
                    title: { display: true, text: '出租号', font: { size: 15, weight: 'bold', family: '"Times New Roman", "SimHei", serif' } },
                    ticks: { font: { size: 13, family: '"Times New Roman", "SimHei", serif' } }
                }
            },
            layout: { padding: { right: 50 } }
        }
    });

    document.querySelector('#chartLegend .legend-text').textContent = chartTitle + '(元)';
    const totalIncome = data.reduce((sum, val) => sum + val, 0).toFixed(2);
    document.getElementById('totalIncome').textContent = '总收益：' + totalIncome + '元';
}

// ===== 列表选择器 =====
function initListSelectors() {
    const now = new Date();
    const records = getRecords();
    const yearSet = new Set([now.getFullYear()]);
    records.forEach(r => yearSet.add(new Date(r.time).getFullYear()));
    const years = [...yearSet].sort((a, b) => b - a);

    const selYear = document.getElementById('listYear');
    selYear.innerHTML = '';
    years.forEach(y => {
        const opt = document.createElement('option');
        opt.value = y; opt.textContent = y + '年';
        if (y === now.getFullYear()) opt.selected = true;
        selYear.appendChild(opt);
    });

    fillListMonths(now.getFullYear(), now.getMonth() + 1);
}

function onListYearChange() {
    const year = parseInt(document.getElementById('listYear').value);
    const now = new Date();
    const defaultMonth = (year === now.getFullYear()) ? now.getMonth() + 1 : 1;
    fillListMonths(year, defaultMonth);
    renderRecordList();
}

function fillListMonths(year, defaultMonth) {
    const records = getRecords();
    const monthSet = new Set();
    records.forEach(r => {
        const d = new Date(r.time);
        if (d.getFullYear() === year) monthSet.add(d.getMonth() + 1);
    });
    monthSet.add(defaultMonth);

    const selMonth = document.getElementById('listMonth');
    selMonth.innerHTML = '';
    [...monthSet].sort((a, b) => a - b).forEach(m => {
        const opt = document.createElement('option');
        opt.value = m; opt.textContent = m + '月';
        if (m === defaultMonth) opt.selected = true;
        selMonth.appendChild(opt);
    });
}

// ===== 出租方式切换 =====
function onTimeTypeChange() {
    const timeType = document.getElementById('timeType').value;
    const durationInput = document.getElementById('duration');
    if (timeType === 'input') {
        durationInput.disabled = false;
        durationInput.placeholder = '请输入时长（小时）';
        durationInput.value = '';
    } else if (timeType === '包夜') {
        durationInput.disabled = true;
        durationInput.placeholder = '1个包夜';
        durationInput.value = '1个包夜';
    } else if (timeType === '包天') {
        durationInput.disabled = true;
        durationInput.placeholder = '1个包天';
        durationInput.value = '1个包天';
    } else if (timeType === '包全天') {
        durationInput.disabled = true;
        durationInput.placeholder = '1个全包天';
        durationInput.value = '1个全包天';
    } else if (timeType === '包月') {
        durationInput.disabled = true;
        durationInput.placeholder = '1个包月';
        durationInput.value = '1个包月';
    }
}

// ===== 新增记录 =====
function addRecord() {
    const rentId = document.getElementById('rentId').value;
    const price = parseFloat(document.getElementById('price').value);
    const timeType = document.getElementById('timeType').value;
    const durationInput = document.getElementById('duration');
    const duration = durationInput.value ? parseFloat(durationInput.value) : 0;

    if (isNaN(price) || price <= 0) { alert('请输入有效的单价！'); return; }
    if (timeType === 'input' && (isNaN(duration) || duration <= 0)) { alert('请输入有效的时长！'); return; }

    let income = 0, durationText = '';
    if (timeType === 'input') {
        income = (duration * price).toFixed(2);
        durationText = duration + '小时';
    } else {
        income = price.toFixed(2);
        durationText = durationInput.value;
    }

    const record = {
        id: Date.now(),
        rentId: rentId,
        type: currentType,
        time: new Date().format('yyyy-MM-dd HH:mm:ss'),
        duration: durationText,
        price: price.toFixed(2),
        income: income
    };

    let records = getRecords();
    records.push(record);
    saveRecords(records);

    initChartSelectors();
    initListSelectors();
    renderRecordList();
    renderChart();

    durationInput.value = '';
    document.getElementById('price').value = '';
    alert('记录保存成功！');
}

// ===== 渲染记录列表 =====
function renderRecordList() {
    const section = document.getElementById('recordSection');
    section.innerHTML = '';

    const year = parseInt(document.getElementById('listYear').value);
    const month = parseInt(document.getElementById('listMonth').value);

    let records = getRecords().filter(r => {
        const d = new Date(r.time);
        return d.getFullYear() === year && d.getMonth() + 1 === month && r.type === currentType;
    });

    if (records.length === 0) {
        section.innerHTML = '<div class="empty-tip">暂无记录</div>';
        return;
    }

    const dayGroups = {};
    records.forEach(r => {
        const d = new Date(r.time);
        const dayKey = d.format('yyyy-MM-dd');
        if (!dayGroups[dayKey]) dayGroups[dayKey] = [];
        dayGroups[dayKey].push(r);
    });

    const sortedDays = Object.keys(dayGroups).sort((a, b) => b.localeCompare(a));

    sortedDays.forEach(dKey => {
        const dayRecords = dayGroups[dKey];
        const dayIncome = dayRecords.reduce((s, r) => s + parseFloat(r.income), 0).toFixed(2);
        const dayCount = dayRecords.length;

        const dayDiv = document.createElement('div');
        dayDiv.className = 'day-group';

        const weekDay = ['周日','周一','周二','周三','周四','周五','周六'][new Date(dKey).getDay()];
        dayDiv.innerHTML = `
            <div class="day-header">
                <span>
                    <span class="arrow">▶</span>
                    ${dKey}（${weekDay}）
                </span>
                <span class="summary">共 ${dayCount} 条 · 收益 ${dayIncome} 元</span>
            </div>
        `;

        const detailDiv = document.createElement('div');
        detailDiv.className = 'day-detail';
        let tableHTML = `
            <table class="record-table">
                <thead><tr>
                    <th><input type="checkbox" class="master-checkbox"></th>
                    <th>出租号</th><th>类型</th><th>开始时间</th><th>时长/类型</th><th>单价(元)</th><th>收益(元)</th><th>操作</th>
                </tr></thead><tbody>
        `;
        [...dayRecords].sort((a, b) => new Date(b.time) - new Date(a.time)).forEach(r => {
            const cfg = TYPE_CONFIG[r.type];
            tableHTML += `
                <tr>
                    <td><input type="checkbox" class="record-check" value="${r.id}"></td>
                    <td>${r.rentId}</td>
                    <td><span class="type-badge ${r.type}">${cfg.name}</span></td>
                    <td>${r.time.split(' ')[1]}</td>
                    <td>${r.duration}</td>
                    <td>${r.price}</td>
                    <td class="income-cell">${r.income}</td>
                    <td><button class="danger-btn btn-delete-single" data-id="${r.id}">删除</button></td>
                </tr>
            `;
        });
        tableHTML += '</tbody></table>';
        detailDiv.innerHTML = tableHTML;

        dayDiv.appendChild(detailDiv);
        section.appendChild(dayDiv);
    });
}

function toggleDay(header) {
    const arrow = header.querySelector('.arrow');
    const detail = header.nextElementSibling;
    arrow.classList.toggle('open');
    detail.classList.toggle('open');
}

function toggleDayCheckboxes(masterCheckbox) {
    const tbody = masterCheckbox.closest('table').querySelector('tbody');
    const checkboxes = tbody.querySelectorAll('.record-check');
    checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
}

// ===== 删除功能 =====
function deleteRecord(id) {
    if (!confirm('确定删除这条记录吗？')) return;
    let records = getRecords();
    records = records.filter(item => item.id !== id);
    saveRecords(records);
    refreshAll();
}

function deleteSelected() {
    const checked = document.querySelectorAll('.record-check:checked');
    if (checked.length === 0) { alert('请先勾选要删除的记录！'); return; }
    if (!confirm('确定删除选中的 ' + checked.length + ' 条记录吗？')) return;

    const ids = new Set();
    checked.forEach(cb => ids.add(parseInt(cb.value)));

    let records = getRecords();
    records = records.filter(item => !ids.has(item.id));
    saveRecords(records);
    refreshAll();
}

function clearAllRecords() {
    if (!confirm('警告：清空后无法恢复！确定继续吗？')) return;
    // 只清空当前类型的记录
    let records = getRecords();
    records = records.filter(r => r.type !== currentType);
    saveRecords(records);
    refreshAll();
}

function refreshAll() {
    initChartSelectors();
    initListSelectors();
    renderRecordList();
    renderChart();
}

// ===== 导出/导入（全部三种类型） =====
function exportData() {
    const allRecords = getRecords();
    if (allRecords.length === 0) { alert('暂无数据可导出！'); return; }

    // 同时导出号码列表
    const exportObj = {
        records: allRecords,
        rentIds: {
            own: getRentIds('own'),
            sublet: getRentIds('sublet'),
            agent: getRentIds('agent')
        },
        exportTime: new Date().format('yyyy-MM-dd HH:mm:ss')
    };

    const dataStr = JSON.stringify(exportObj, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    const now = new Date().format('yyyyMMdd_HHmmss');
    a.href = url;
    a.download = '出租收益_全部数据备份_' + now + '.json';
    a.click();

    URL.revokeObjectURL(url);
    alert('导出成功！已备份全部三种类型的数据和号码列表。');
}

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (!confirm('导入会将文件中的数据合并到现有记录中，是否继续？')) {
        event.target.value = '';
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            let importedRecords = [];
            let importedRentIds = null;

            // 兼容旧格式（纯数组）和新格式（对象）
            if (Array.isArray(imported)) {
                importedRecords = imported;
            } else if (imported.records && Array.isArray(imported.records)) {
                importedRecords = imported.records;
                importedRentIds = imported.rentIds;
            } else {
                alert('文件格式错误！'); return;
            }

            const existing = getRecords();
            const existingIds = new Set(existing.map(r => r.id));
            let newCount = 0;
            importedRecords.forEach(r => {
                if (!existingIds.has(r.id) && r.id && r.rentId && r.time && r.income) {
                    if (!r.type) r.type = 'own';
                    existing.push(r);
                    newCount++;
                }
            });
            saveRecords(existing);

            // 恢复号码列表（合并去重）
            if (importedRentIds) {
                ['own', 'sublet', 'agent'].forEach(type => {
                    if (importedRentIds[type]) {
                        const currentIds = getRentIds(type);
                        const merged = [...new Set([...currentIds, ...importedRentIds[type]])];
                        saveRentIds(merged, type);
                    }
                });
            }

            refreshAll();
            alert('导入成功！新增 ' + newCount + ' 条记录。');
        } catch (err) {
            alert('文件解析失败，请确认是正确的备份文件！');
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

// ===== 同步状态提示 =====
function showSyncStatus(msg) {
    let el = document.getElementById('syncStatus');
    if (!el) {
        el = document.createElement('div');
        el.id = 'syncStatus';
        el.style.cssText = 'position:fixed;top:10px;left:10px;z-index:9999;padding:6px 12px;border-radius:4px;font-size:12px;background:#67c23a;color:white;';

// ===== 数据操作（Supabase + localStorage双写） =====
async function syncFromCloud() {
    _syncStatus = 'syncing';
    showSyncStatus('正在同步...');
    try {
        // 拉取记录
        const { data: recordsData, error: rErr } = await supabase.from('records').select('*');
        if (rErr) throw rErr;
        if (recordsData && recordsData.length > 0) {
            _recordsCache = recordsData.map(r => ({
                id: r.id, rentId: r.rent_id, type: r.type, time: r.time,
                duration: r.duration, price: r.price, income: r.income
            }));
            localStorage.setItem('rentRecords', JSON.stringify(_recordsCache));
        } else {
            _recordsCache = getRecordsLocal();
        }

        // 拉取号码列表
        const { data: idsData, error: iErr } = await supabase.from('rent_ids').select('*');
        if (iErr) throw iErr;
        if (idsData && idsData.length > 0) {
            _rentIdsCache = {};
            idsData.forEach(row => {
                _rentIdsCache[row.type] = row.ids || [];
            });
            ['own','sublet','agent'].forEach(t => {
                localStorage.setItem('rentIds_' + t, JSON.stringify(_rentIdsCache[t] || DEFAULT_RENT_IDS[t] || []));
            });
        } else {
            _rentIdsCache = {
                own: getRentIdsLocal('own'),
                sublet: getRentIdsLocal('sublet'),
                agent: getRentIdsLocal('agent')
            };
        }

        _syncStatus = 'idle';
        showSyncStatus('同步完成');
    } catch (err) {
        console.error('Sync error:', err);
        _syncStatus = 'error';
        showSyncStatus('同步失败，使用本地数据');
        _recordsCache = getRecordsLocal();
        _rentIdsCache = {
            own: getRentIdsLocal('own'),
            sublet: getRentIdsLocal('sublet'),
            agent: getRentIdsLocal('agent')
        };
    }
}

async function pushRecordsToCloud(records) {
    try {
        // 先清空再插入（简单策略）
        await supabase.from('records').delete().neq('id', 0);
        if (records.length > 0) {
            const rows = records.map(r => ({
                id: r.id, rent_id: r.rentId, type: r.type, time: r.time,
                duration: r.duration, price: r.price, income: r.income
            }));
            await supabase.from('records').insert(rows);
        }
    } catch (err) {
        console.error('Push records error:', err);
    }
}

async function pushRentIdsToCloud(type, ids) {
    try {
        await supabase.from('rent_ids').upsert({ type: type, ids: ids }, { onConflict: 'type' });
    } catch (err) {
        console.error('Push rentIds error:', err);
    }
}

// localStorage 备用
function getRecordsLocal() {
    const data = localStorage.getItem('rentRecords');
    return data ? JSON.parse(data) : [];
}
function saveRecordsLocal(records) {
    localStorage.setItem('rentRecords', JSON.stringify(records));
}
function getRentIdsLocal(type) {
    const data = localStorage.getItem('rentIds_' + type);
    return data ? JSON.parse(data) : (DEFAULT_RENT_IDS[type] || []);
}
function saveRentIdsLocal(ids, type) {
    localStorage.setItem('rentIds_' + type, JSON.stringify(ids));
}

// 对外接口
function getRecords() {
    if (_recordsCache !== null) return _recordsCache;
    return getRecordsLocal();
}
async function saveRecords(records) {
    _recordsCache = records;
    saveRecordsLocal(records);
    await pushRecordsToCloud(records);
}
function getRentIds(type) {
    type = type || currentType;
    if (_rentIdsCache[type]) return _rentIdsCache[type];
    return getRentIdsLocal(type);
}
async function saveRentIds(ids, type) {
    type = type || currentType;
    _rentIdsCache[type] = ids;
    saveRentIdsLocal(ids, type);
    await pushRentIdsToCloud(type, ids);
}

// 初始化时同步
window.addEventListener('load', async function() {
    await syncFromCloud();
    initRentIds();
    initChartSelectors();
    initListSelectors();
    renderRecordList();
    renderChart();
    bindDeleteEvents();
});

Date.prototype.format = function(fmt) {
    const o = { "M+": this.getMonth()+1, "d+": this.getDate(), "H+": this.getHours(), "m+": this.getMinutes(), "s+": this.getSeconds() };
    if (/(y+)/.test(fmt)) fmt = fmt.replace(RegExp.$1, (this.getFullYear()+"").substr(4-RegExp.$1.length));
    for (let k in o) if (new RegExp("("+k+")").test(fmt)) fmt = fmt.replace(RegExp.$1, RegExp.$1.length==1 ? o[k] : ("00"+o[k]).substr((""+o[k]).length));
    return fmt;
};
